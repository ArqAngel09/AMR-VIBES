name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/**'
      - 'AMR-VIBES.jucer'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libcurl4-openssl-dev

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          cmdline-tools-version: 15859902

      - name: Clone JUCE 9.0.2
        run: git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git JUCE

      - name: Build Projucer
        run: |
          cmake -S JUCE -B juce-build -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=ON
          cmake --build juce-build --target Projucer --config Release --parallel 2

      - name: Generate Android Studio project
        shell: bash
        run: |
          PROJUCER=$(find juce-build -type f -name Projucer -perm -111 | head -n 1)
          test -n "$PROJUCER"
          set +e
          "$PROJUCER" --resave AMR-VIBES.jucer --fix-missing-dependencies --fix-missing-dependencies 2>&1 | tee projucer.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then exit $status; fi
          test -f Builds/Android/app/build.gradle

      - name: Prepare Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        working-directory: Builds/Android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease_Release --no-daemon --stacktrace --info 2>&1 | tee android-build.log

      - name: Diagnose Android build
        if: failure()
        run: |
          echo "===== Gradle error summary ====="
          grep -E "FAILED|FAILURE|error:|Error:|What went wrong|Execution failed" Builds/Android/android-build.log | tail -n 120 || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AMR-VIBES-Android-build-log
          path: |
            Builds/Android/android-build.log
            projucer.log
          if-no-files-found: warn

      - name: Locate APK
        id: locate_apk
        shell: bash
        run: |
          echo "===== Android output tree ====="
          find Builds/Android/app/build/outputs -maxdepth 6 -type f -print || true
          APK=$(find Builds/Android/app/build/outputs -type f -name "*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "No APK found after successful Gradle build."
            exit 1
          fi
          echo "APK found at: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMR-VIBES-Android
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
