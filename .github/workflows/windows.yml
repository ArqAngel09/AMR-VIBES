name: Build Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64
    - name: Build
      run: cmake --build build --config Release --parallel
    - name: Package
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force dist | Out-Null
        $vst = Get-ChildItem build -Recurse -Directory -Filter "AMR VIBES.vst3" | Select-Object -First 1
        if (-not $vst) { throw "VST3 not found" }
        Copy-Item $vst.FullName dist -Recurse
        $exe = Get-ChildItem build -Recurse -File -Filter "AMR VIBES.exe" | Select-Object -First 1
        if (-not $exe) { throw "Standalone EXE not found" }
        Copy-Item $exe.FullName "distAMR VIBES.exe"
        Compress-Archive -Path "dist*" -DestinationPath "AMR-VIBES-Windows.zip" -Force
    - uses: actions/upload-artifact@v4
      with:
        name: AMR-VIBES-Windows
        path: |
          AMR-VIBES-Windows.zip
          dist/AMR VIBES.exe
          dist/AMR VIBES.vst3
        if-no-files-found: error
